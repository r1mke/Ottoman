name: ottoman

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in deploy/.env}
      MSSQL_PID: Developer
    ports:
      # Loopback only: the database is reached by the api/worker over the compose network, not from outside.
      - "127.0.0.1:${SQL_PORT:-14330}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3.6-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in deploy/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/.env}
    ports:
      # Loopback only (AMQP and the management UI are not for other machines).
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Local SMTP inbox for development. Open http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api:
    build:
      context: ..
      dockerfile: deploy/Api.Dockerfile
    restart: unless-stopped
    depends_on:
      sql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Safe by default: Production unless deploy/.env says Development (local demo). StartupGuards then refuse
      # placeholder secrets and demo accounts.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Server=sql;Database=220048;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in deploy/.env (min 32 chars)}
      Jwt__Issuer: ${JWT_ISSUER:-ottoman}
      Jwt__Audience: ${JWT_AUDIENCE:-ottoman-clients}
      Database__MigrateOnStartup: "true"
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-Test123!}
      Payments__SecretKey: ${STRIPE_SECRET_KEY:-}
      Payments__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Payments__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      DataProtection__KeyEncryptionSecret: ${DP_KEY_ENCRYPTION_SECRET:-}
      Cors__Origins__0: ${CORS_ORIGIN:-}
      # The API publishes its outbox to RabbitMQ (one connection, publisher confirms).
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__ClientName: ottoman-api
    ports:
      - "${API_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: deploy/Worker.Dockerfile
    restart: unless-stopped
    depends_on:
      sql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      # The API applies migrations on start; the worker must not query a schema that does not exist yet.
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Server=sql;Database=220048;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in deploy/.env (min 32 chars)}
      Payments__SecretKey: ${STRIPE_SECRET_KEY:-}
      Payments__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Firebase__ServiceAccountJson: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      DataProtection__KeyEncryptionSecret: ${DP_KEY_ENCRYPTION_SECRET:-}
      # The worker consumes the events (e-mail, inbox, push).
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__ClientName: ottoman-worker
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__Security: ${SMTP_SECURITY:-}
      Smtp__From: ${SMTP_FROM:-noreply@ottoman.local}

volumes:
  sqldata:
